<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piezas Accord</title>
<meta name="theme-color" content="#15191B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Piezas">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}

/* Layout: mostrador de refacciones — buscador fijo arriba, lista de etiquetas de pieza, barra de pestañas abajo */
:root{
  --bg:#ECEEEC; --surface:#FFFFFF; --sunk:#E2E6E4; --ink:#15191B; --muted:#5B6569; --line:#D2D8D6;
  --head:#15191B; --tag:#F3C22B; --tag-ink:#1E1A08; --ok:#1D7A4C; --ok-bg:#DDF1E6; --warn:#A94F12; --warn-bg:#FBE7D7; --danger:#B3261E;
  --shadow:0 1px 2px rgba(20,25,27,.08),0 4px 14px rgba(20,25,27,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111416; --surface:#1A1E21; --sunk:#14181A; --ink:#E6EAEB; --muted:#8D989C; --line:#2A3135;
  --head:#08090A; --tag:#E2B323; --tag-ink:#1A1606; --ok:#56C38B; --ok-bg:#163326; --warn:#F0A066; --warn-bg:#3A2414; --danger:#FF8A80;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --head:#08090A; --bg:#111416; --surface:#1A1E21; --sunk:#14181A; --ink:#E6EAEB; --muted:#8D989C; --line:#2A3135;
  --tag:#E2B323; --tag-ink:#1A1606; --ok:#56C38B; --ok-bg:#163326; --warn:#F0A066; --warn-bg:#3A2414; --danger:#FF8A80;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
img{max-width:100%}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:#fff}
header.top .wrap{padding-block:10px 12px;display:grid;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;color:#fff}
.brand h1 span{color:var(--tag)}
.brand small{color:#AEB7BB;font-size:12px;text-align:right;line-height:1.2}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:0 10px;height:46px}
.search svg{flex:none;color:#5B6569}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#15191B;font-size:17px;height:100%}
.search button{border:0;background:none;color:#5B6569;font-size:20px;padding:4px 6px}
main{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:14px;display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--tag);border-color:var(--tag);color:var(--tag-ink);font-weight:700}
.hint{color:var(--muted);font-size:13px}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:left;width:100%}
.item .ph{width:72px;height:72px;border-radius:6px;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.item .ph img{max-width:100%;max-height:100%;object-fit:contain}
.item .t{min-width:0;display:grid;gap:2px}
.pn{font-family:var(--f-mono);font-size:13px;letter-spacing:.02em}
.item .es{font-weight:700;font-size:15px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .en{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{display:grid;gap:4px;justify-items:end;text-align:right}
.price{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.price.none{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.stock{font-size:12px;font-weight:700;border-radius:4px;padding:2px 7px;white-space:nowrap}
.stock.y{background:var(--ok-bg);color:var(--ok)}
.stock.n{background:var(--sunk);color:var(--muted);font-weight:400}
.more{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.sec-h{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:15px;color:var(--muted);margin:6px 0 0}
.cat{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.cat b{font-size:16px}
.cat span{color:var(--muted);font-size:13px;white-space:nowrap}
.back{border:0;background:none;color:var(--muted);padding:0;font-size:14px;justify-self:start}
h2.title{margin:0;font-family:var(--f-display);font-size:26px;line-height:1.1;text-wrap:balance}
.diag-btn{display:block;width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;position:relative}
.diag-btn img{width:100%;display:block}
.diag-btn em{position:absolute;right:10px;bottom:10px;background:var(--head);color:#fff;font-style:normal;font-size:12px;padding:4px 8px;border-radius:6px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:10px 0 9px;display:grid;justify-items:center;gap:3px;font-size:12px;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"] svg{color:var(--warn)}
/* hoja de detalle */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet .bar .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:10px}
.sheet .bar button{border:0;background:none;font-size:15px;color:var(--muted);padding:6px 0}
.sheet .body{padding-block:14px;display:grid;gap:14px}
.photo{background:#fff;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;min-height:200px;padding:10px}
.photo img{max-height:300px;object-fit:contain}
.tagline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-size:16px;padding:6px 10px;border-radius:6px;position:relative;padding-left:22px}
.tag::before{content:"";position:absolute;left:8px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--bg)}
.copy{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:13px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.meta dt{color:var(--muted)}
.meta dd{margin:0;min-width:0}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;font-size:16px;color:var(--ink);width:100%;min-width:0}
.qty{display:grid;grid-template-columns:44px 1fr 44px;gap:6px}
.qty button{border:1px solid var(--line);background:var(--sunk);border-radius:8px;font-size:20px}
.qty input{text-align:center}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:16px;background:var(--ink);color:var(--bg)}
.btn.alt{background:var(--tag);color:var(--tag-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:400}
.btn:disabled{opacity:.5}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.status.ok{color:var(--ok)} .status.err{color:var(--danger)}
.zoom{position:fixed;inset:0;z-index:60;background:#fff;display:grid;grid-template-rows:auto 1fr}
.zoom .zbar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--head);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.zoom .zbar button{border:1px solid #444;background:#222;color:#fff;border-radius:6px;padding:6px 10px}
.zoom .zarea{overflow:auto;-webkit-overflow-scrolling:touch}
.zoom .zarea img{display:block;max-width:none}
.sale{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sale:last-child{border-bottom:0}
.sale small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.example{font-size:12px;color:var(--warn);background:var(--warn-bg);padding:2px 6px;border-radius:4px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
nav.tabs .wrap{grid-template-columns:repeat(5,1fr)}
nav.tabs button{position:relative}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
.avail{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.cb{font-family:var(--f-mono);font-size:11px;border-radius:4px;padding:1px 5px;background:var(--ok-bg);color:var(--ok)}
.cb.q{background:var(--tag);color:var(--tag-ink)}
.st{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:2px 7px;white-space:nowrap}
.st-esta{background:var(--ok-bg);color:var(--ok)}
.st-quitada{background:var(--tag);color:var(--tag-ink)}
.st-vendida{background:var(--sunk);color:var(--muted)}
.st-mala{background:var(--warn-bg);color:var(--danger)}
.st-revisar{background:var(--warn-bg);color:var(--warn)}
.st-falta{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.st-na{background:var(--sunk);color:var(--muted)}
.carrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.carrow:last-child{border-bottom:0}
.carcode{font-family:var(--f-display);font-weight:700;font-size:22px;background:var(--head);color:var(--tag);border-radius:6px;padding:2px 8px;min-width:48px;text-align:center}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:12px}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:700}
.walk{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.walk .ph{width:56px;height:56px;border-radius:6px;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.walk .ph img{max-width:100%;max-height:100%;object-fit:contain}
.walk .t{min-width:0;display:grid;gap:6px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-variant-numeric:tabular-nums}
.tline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tline .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tline .ctl input{width:90px;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--surface);color:var(--ink);font-size:15px}
.tline .ctl button{border:1px solid var(--line);background:var(--sunk);border-radius:6px;min-width:34px;height:34px;font-size:17px}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding-top:10px;font-size:15px}
.sum .tot{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1}
.sum .neg{color:var(--danger)}
.pcts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pcts button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 0;font-weight:700}
.pcts button[aria-pressed="true"]{background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
.drow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12px;color:var(--muted)}

.login{min-height:100%;display:grid;place-items:center;padding-block:40px}
.login .card{width:100%;max-width:420px;display:grid;gap:12px}
.login h1{margin:0;font-family:var(--f-display);font-size:34px;text-transform:uppercase;letter-spacing:.02em}
.login h1 span{color:var(--warn)}
.hdr-btn{border:1px solid #3a4246;background:transparent;color:#fff;border-radius:8px;padding:4px 8px;font-size:12px}
.netchip{font-size:11px;border-radius:999px;padding:2px 8px;background:#2a3135;color:#cfd6d9;white-space:nowrap}
.netchip.off{background:#5a2a12;color:#ffd9bf}
.brand .right{display:flex;gap:6px;align-items:center}
.alt{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:13px;background:var(--sunk);border-radius:6px;padding:4px 8px}
.alt button{border:0;background:none;color:var(--danger);font-size:14px;padding:0 2px}
.who{font-size:12px;color:var(--muted)}
.sug{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:right}
.realtag{display:inline-block;justify-self:start;width:max-content;font-size:11px;background:#1f6f43;color:#fff;border-radius:4px;padding:1px 6px;margin-right:4px;vertical-align:middle}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gal button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:0;overflow:hidden;aspect-ratio:1;position:relative}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal em{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-style:normal;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot{display:grid;place-items:center;gap:6px;border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;background:var(--sunk);cursor:pointer}
.shot input{position:absolute;width:1px;height:1px;opacity:0}
.shot b{font-size:17px}
.cand{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface)}
.cand .ph{width:64px;height:64px;border-radius:6px;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.cand .ph img{max-width:100%;max-height:100%;object-fit:contain}
.cand .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.cand .acts .btn{padding:8px 12px;font-size:14px;flex:1}
.tk{background:#fff;color:#111;border-radius:6px;padding:16px 14px;font-family:var(--f-mono),ui-monospace,monospace;font-size:13px;line-height:1.45;max-width:340px;margin:0 auto;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tk h3{margin:0;text-align:center;font-size:17px;text-transform:uppercase}
.tk .c{text-align:center}
.tk hr{border:0;border-top:1px dashed #999;margin:8px 0}
.tk .l{display:flex;justify-content:space-between;gap:10px}
.tk .l span:first-child{min-width:0}
.tk .big{font-size:17px;font-weight:700}
.tk small{color:#555}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media print{body *{visibility:hidden!important}.tk,.tk *{visibility:visible!important}.tk{position:absolute;left:0;top:0;box-shadow:none;width:72mm;max-width:none}}
.zoom{grid-template-columns:minmax(0,1fr)}
.zoom .zbar{min-width:0;position:relative;z-index:2}
.zoom .zarea{min-width:0;min-height:0;touch-action:pan-x pan-y;padding-bottom:90px}
.zoom .zx{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:3;background:#15191B;color:#fff;border:2px solid #fff;border-radius:999px;padding:14px 26px;font-size:17px;font-weight:700;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.35)}

html,body,nav.tabs,nav.tabs button{touch-action:manipulation}
.carside{display:grid;gap:5px;justify-items:center}
.carpic{width:74px;height:50px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.carpic.big{width:100%;height:auto;max-height:240px;margin:8px 0 4px;border-radius:10px}

.kpib{text-align:left;font:inherit;color:inherit;cursor:pointer;display:grid}
.kpib:active{background:var(--sunk)}

.pcar{position:relative}
.pcar>img[hidden]{display:none}
.parr{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);color:#15191B;font-size:26px;line-height:1;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.15);z-index:2}
.parr[hidden]{display:none}
.parr.l{left:8px}.parr.r{right:8px}
.pcount{position:absolute;bottom:8px;right:10px;font-size:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:2px 8px}
.v3box{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:pan-y;user-select:none;cursor:grab;min-height:180px;display:grid;place-items:center}
.v3box img{width:100%;display:block;pointer-events:none}
.v3hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 10px;border-radius:999px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{display:grid;justify-items:center;gap:2px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 4px;font:inherit;cursor:pointer}
.mode span{font-size:26px}.mode b{font-size:14px}.mode small{font-size:11px;color:var(--muted);text-align:center}
.mode[aria-pressed="true"]{border-color:var(--tag);background:var(--sunk)}
.upd{position:sticky;top:0;z-index:30;padding:10px 16px;background:var(--bg)}
.upd .btn{width:100%;font-size:19px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}

.fbbtn{background:#1877f2;border-color:#1877f2;color:#fff}.fbbtn small{opacity:.8;font-weight:400}

</style>
</head>
<body>
<div id="login" class="wrap login" hidden>
  <div class="card">
    <h1>Piezas <span>Accord</span></h1>
    <p class="hint" style="margin:0"><b>Acceso para vendedores y creadores.</b> ¿Eres cliente? <a href="tienda.html">Ve a la tienda</a>.</p>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

const CFG={"apiKey": "AIzaSyDzuZ87H9TLq6RHyDx0Vd_K_ancv7EguhI", "authDomain": "piezas-accord.firebaseapp.com", "projectId": "piezas-accord", "storageBucket": "piezas-accord.firebasestorage.app", "messagingSenderId": "543559376331", "appId": "1:543559376331:web:bb32ea7e32bf5078b12a4e"};
const OWNER='alanjavier467@gmail.com';
const normUser=u=>String(u||'').trim().toLowerCase().normalize('NFC');
async function userEmail(u){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(normUser(u)));return 'u'+[...new Uint8Array(h)].slice(0,16).map(b=>b.toString(16).padStart(2,'0')).join('')+'@usuarios.piezas-accord.app'}
const pinPass=p=>'pin-'+p+'-pz';

const fb=initializeApp(CFG);

const fs=initializeFirestore(fb,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

const D=await fetch('data.json').then(r=>r.json());
const SECS=D.secs, PARTS=D.parts;
const $=s=>document.querySelector(s);
const view=$('#view'), sheet=$('#sheet'), zoom=$('#zoom'), qIn=$('#q'), qx=$('#qx');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'');
const money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});
const CATS=[...new Set(SECS.map(s=>s.cat))];
const VERSION='20261028-0139';
const BYPN={};PARTS.forEach((p,i)=>{p.i=i;p.key=norm(p.es+' '+p.en+' '+SECS[p.s].es+' '+SECS[p.s].en+' '+p.n);p.pnk=p.pn.replace(/-/g,'').toLowerCase();if(!BYPN[p.pn])BYPN[p.pn]=p});
const UPN=Object.keys(BYPN);
const EXT={'NH731P':'Negro cristal perlado','NH883P':'Blanco platino perlado','NH830M':'Plata lunar metálico','NH797M':'Gris acero metálico','R94':'Rojo San Marino','B575P':'Azul noche perlado'};
PARTS.forEach(p=>{const m=(p.es+' '+p.en).match(/\*(NH731P|NH883P|NH830M|NH797M|R94|B575P)\*/);p.ext=m?m[1]:null});
// números por año/versión: p.y = {'18':..,'19':..,'20T':..}; '' = no existe en esa versión; sin clave = mismo número
const YL={'18':'2018 1.5T','19':'2019 1.5T','20':'2020 1.5T','20T':'2020 2.0T'};const YK=['18','19','20','20T'];
PARTS.forEach(p=>{if(p.y)p.ypk=Object.values(p.y).flat().filter(Boolean).map(x=>x.replace(/-/g,'').toLowerCase()).join(' ')});
function verOf(c){if(!c)return null;if(c._v!==undefined)return c._v;let r=null;
  if(c.ver)r=c.ver;else{const v=(c.vin||'').toUpperCase().trim();
    if(v.length===17){const yc=v[9];const yr=yc==='J'?'18':yc==='K'?'19':/[L-N]/.test(yc)?'20':null;r=v[5]==='2'?'20T':yr}
    if(!r){const y=String(c.year||'');r=y==='2018'?'18':y==='2019'?'19':/^20(2\d)$/.test(y)?'20':null}}
  try{Object.defineProperty(c,'_v',{value:r,enumerable:false})}catch(e){}return r}
function yNum(p,ver){if(ver==='20'&&p.y&&p.y['20']==='')return null;if(!ver||ver==='20'||!p.y||!(ver in p.y))return p.pn;const y=p.y[ver];return y===''?null:[].concat(y).join(' / ')}
function naWhy(c,p){return p&&p.ext&&c.color&&p.ext!==c.color?'otro color':'no viene en esta versión'}
const STS=[['esta','En el carro'],['quitada','Quitada y guardada'],['vendida','Vendida'],['mala','Dañada'],['revisar','Por revisar'],['falta','No está']];
const STL=Object.fromEntries(STS.concat([['na','No aplica']]));
const AVAIL=s=>s==='esta'||s==='quitada';
const EMP_MAX_DISC=10;

// ---- estado ----
let ME=null, OWN=false, PROFILE=null;
let CARS=[], PRIV={}, EST={}, PRICE={}, SALES=[], ALT={}, USERS=[];
let FOTOS={}, FOTOLIST=[], EXTRAS=[], NEG={}, CLIENTES=[];
const priceOf=pn=>{const v=PRICE[pn];return v?v:((BYPN[pn]||{}).sp||0)};
const isSug=pn=>!PRICE[pn];
const xById=id=>EXTRAS.find(x=>x.id===id);
const xAvail=x=>x&&x.status!=='vendida'&&(x.qty||0)>0;
const st={tab:'buscar',q:'',cat:'',onlyStock:false,limit:40,catView:null,secView:null,car:null,carSec:null};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let CART=LS.get('comanda',[]); let DISC=Object.assign({mode:'pct',pct:0,amt:'',target:''},LS.get('desc',{})); let CLIENTE=LS.get('cliente',''); let CLIID=LS.get('cliid','');let CLIQ='';
const ptsFor=t=>Math.floor((+t||0)/100);
function saveCart(){LS.set('comanda',CART);LS.set('desc',DISC);LS.set('cliente',CLIENTE);const b=$('#badge');const n=CART.reduce((a,l)=>a+l.qty,0);b.hidden=!n;b.textContent=n}
const carsSorted=()=>CARS.slice().sort((a,b)=>(a.llegada||'9999').localeCompare(b.llegada||'9999')||a.code.localeCompare(b.code));
const units=p=>p&&p.cr?p.cr:1;
function stOf(car,pn){const p=BYPN[pn];if(p&&p.ext&&car.color&&p.ext!==car.color)return {s:'na',n:0};
  if(p&&p.y){const vr=verOf(car);if(vr&&p.y[vr]==='')return {s:'na',n:0}}
  const e=(EST[car.id]||{})[pn];const def=car.def||'esta';
  if(!e)return {s:def,n:AVAIL(def)?units(p):0};
  return {s:e.s,n:e.n!=null?e.n:(AVAIL(e.s)?units(p):0)}}
const availCars=pn=>carsSorted().map(c=>({c,x:stOf(c,pn)})).filter(o=>AVAIL(o.x.s)&&o.x.n>0);
const inCart=(pn,carId)=>CART.filter(l=>l.pn===pn&&l.car===carId).reduce((a,l)=>a+l.qty,0);
const carCode=id=>(CARS.find(c=>c.id===id)||{}).code||'?';
const ubiOf=(carId,pn)=>((EST[carId]||{})[pn]||{}).u||'';
const UBIS=()=>{const set=new Set(['T-1','T-2','T-3','T-4','T-5','T-6','T-7','T-8','G-1','G-2','G-3','G-4']);Object.values(EST).forEach(m=>Object.values(m||{}).forEach(v=>v&&v.u&&set.add(v.u)));EXTRAS.forEach(x=>x.ubi&&set.add(x.ubi));return [...set].sort()};
const ubiList=()=>`<datalist id="ubis">${UBIS().map(u=>`<option value="${esc(u)}">`).join('')}</datalist>`;
const maxDuenos=()=>Math.min(4,Math.max(1,+(NEG.maxDuenos||2)));
const nDuenos=()=>1+USERS.filter(u=>u.role==='dueño'&&u.active).length;
const altsOf=pn=>Object.entries(ALT).filter(([k,v])=>v.pn===pn).map(([k])=>k);

// ---- imágenes ----
const bundles={};const bundle=i=>bundles[i]||(bundles[i]=fetch('p/'+i+'.json').then(r=>r.json()).catch(()=>({})));
const dcache={};const diagrams=i=>dcache[i]||(dcache[i]=fetch('d/'+i+'.json').then(r=>r.json()).catch(()=>[]));
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const img=e.target;io.unobserve(img);bundle(+img.dataset.s).then(b=>{const u=b[img.dataset.k];if(u)img.src=u;else img.alt='Sin foto'})})},{rootMargin:'300px'});
const hookImgs=root=>root.querySelectorAll('img[data-k]').forEach(i=>io.observe(i));
const imgTag=p=>`<img data-s="${p.s}" data-k="${esc(p.pn+'|'+p.ref)}" alt="">`;
const phTag=p=>{const f=FOTOS[p.pn];return f&&f.length?`<img src="${f[0].thumb}" alt="Foto real">`:imgTag(p)};

// ---- búsqueda ----
function search(q){const nq=norm(q).trim();if(!nq)return null;const compact=nq.replace(/[\s-]/g,'');const words=nq.split(/\s+/).filter(Boolean);const out=[];
  const altHits=new Set();if(compact.length>=3)for(const [a,v] of Object.entries(ALT)){if(a.toLowerCase().includes(compact))altHits.add(v.pn)}
  for(const p of PARTS){let sc=0;
    if(compact.length>=3&&/\d/.test(compact)&&p.pnk.includes(compact))sc=p.pnk.startsWith(compact)?100:80;
    else if(compact.length>=3&&/\d/.test(compact)&&p.ypk&&p.ypk.includes(compact))sc=85;
    else if(altHits.has(p.pn))sc=90;
    else if(words.every(w=>p.key.includes(w))){sc=10;if(norm(p.es).startsWith(words[0]))sc+=6;if(norm(p.es).includes(nq))sc+=4;if(norm(p.en).includes(nq))sc+=3}
    if(sc)out.push([sc,p])}
  out.sort((a,b)=>b[0]-a[0]||a[1].es.length-b[1].es.length);return out.map(x=>x[1])}
function availHTML(pn){if(!CARS.length)return '';const a=availCars(pn);if(!a.length)return '<span class="stock n">Sin existencia</span>';
  return `<span class="avail">${a.map(o=>`<span class="cb ${o.x.s==='quitada'?'q':''}">${esc(o.c.code)}${o.x.n>1?'×'+o.x.n:''}${ubiOf(o.c.id,pn)?' · '+esc(ubiOf(o.c.id,pn)):''}</span>`).join('')}</span>`}
function priceHTML(pn){const pr=priceOf(pn);return pr?`<span class="price">${money(pr)}</span>${isSug(pn)?'<span class="sug">sugerido</span>':''}`:'<span class="price none">Sin precio</span>'}
function itemHTML(p,pre){const nf=(FOTOS[p.pn]||[]).length;
  return `<button class="item" data-open="${p.i}"><span class="ph">${phTag(p)}</span>
   <span class="t">${pre||''}${nf?'<span class="realtag">📷 foto real</span>':''}<span class="pn">${esc(p.pn)}</span><span class="es">${esc(p.es)}</span>${p.en?`<span class="en">${esc(p.en)}</span>`:''}</span>
   <span class="r">${priceHTML(p.pn)}${availHTML(p.pn)}</span></button>`}
function xItemHTML(x){const f=FOTOS['X:'+x.id]||[];
  return `<button class="item" data-openx="${esc(x.id)}"><span class="ph">${f.length?`<img src="${f[0].thumb}" alt="">`:'📦'}</span>
   <span class="t"><span class="realtag">Agregada</span>${x.num?`<span class="pn">${esc(x.num)}</span>`:''}<span class="es">${esc(x.name)}</span>${x.cond?`<span class="en">${esc(x.cond)}</span>`:''}</span>
   <span class="r">${x.price?`<span class="price">${money(x.price)}</span>${x.sug?'<span class="sug">sugerido</span>':''}`:'<span class="price none">Sin precio</span>'}${xAvail(x)?`<span class="avail"><span class="cb">${esc(x.car?carCode(x.car):'Bodega')}${x.qty>1?'×'+x.qty:''}</span></span>`:'<span class="stock n">Vendida</span>'}</span></button>`}
function searchExtras(q){const nq=norm(q).trim();if(!nq)return [];const c=nq.replace(/[\s-]/g,'');const w=nq.split(/\s+/);
  return EXTRAS.filter(x=>{const k=norm(x.name+' '+x.num+' '+x.cond+' '+(x.nota||''));return (c.length>=3&&norm(x.num).replace(/[\s-]/g,'').includes(c))||w.every(t=>k.includes(t))})}
function renderList(arr){if(!arr.length)return '<div class="empty">No encontré piezas con eso en el catálogo. Prueba otra palabra, en inglés, o parte del número.<br><br><button class="btn alt" data-intake style="font-size:17px;padding:14px">📷 Agregar pieza con foto</button></div>';
  return `<div class="list">${arr.slice(0,st.limit).map(p=>itemHTML(p)).join('')}</div>`+(arr.length>st.limit?`<button class="more" data-more>Mostrar más (${arr.length-st.limit} restantes)</button>`:'')}

// ---- vistas ----
function vBuscar(){let arr=search(st.q);
  const chips=`<div class="row">${['',...CATS].map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${st.cat===c}">${c?esc(c.split(' / ')[0]):'Todo'}</button>`).join('')}<button class="chip" data-stockonly aria-pressed="${st.onlyStock}">Solo lo que tengo</button></div>`;
  if(!arr){if(st.onlyStock||st.cat)arr=PARTS;else{
    const tips=['faro','headlight','espejo','sensor','bomba','defensa','33100','módulo','rin','asiento'];
    view.innerHTML=`<button class="btn alt" data-intake style="width:100%;margin-bottom:10px;font-size:17px;padding:14px">📷 Agregar pieza con foto</button>`+chips+(EXTRAS.filter(xAvail).length?`<p class="sec-h">Piezas que agregaste con foto (${EXTRAS.filter(xAvail).length})</p><div class="list">${EXTRAS.filter(xAvail).slice(0,6).map(xItemHTML).join('')}</div>`:'')+`<div class="card"><b>Escribe arriba lo que buscas.</b><p class="hint" style="margin:.4em 0 0">Número completo o un pedazo (con o sin guiones), nombre en español o en inglés, o el número que trae la pieza si lo guardaron como alterno.</p><div class="row" style="margin-top:8px">${tips.map(t=>`<button class="chip" data-try="${t}">${t}</button>`).join('')}</div></div>
    <div id="offline-card"></div>
    <p class="sec-h">O explora por categoría</p>${CATS.map(c=>`<button class="cat" data-gocat="${esc(c)}"><b>${esc(c)}</b><span>${PARTS.filter(p=>SECS[p.s].cat===c).length} piezas ›</span></button>`).join('')}`;renderOffline();return}}
  if(st.cat)arr=arr.filter(p=>SECS[p.s].cat===st.cat);
  if(st.onlyStock)arr=arr.filter(p=>availCars(p.pn).length);
  const seen=new Set();arr=arr.filter(p=>!seen.has(p.pn)&&seen.add(p.pn));
  const xs=st.q?searchExtras(st.q).filter(x=>!st.onlyStock||xAvail(x)):[];
  view.innerHTML=chips+(xs.length?`<p class="sec-h">Agregadas por ti con foto</p><div class="list">${xs.map(xItemHTML).join('')}</div><p class="sec-h">Catálogo</p>`:'')+`<p class="hint">${arr.length} ${arr.length===1?'resultado':'resultados'}</p>`+renderList(arr)}
function vCatalogo(){
  if(st.secView!=null){const s=SECS[st.secView];const ps=PARTS.filter(p=>p.s===s.i);
    view.innerHTML=`<button class="back" data-back="sec">‹ ${esc(s.cat)}</button><h2 class="title">${esc(s.es)}</h2>${s.en?`<p class="hint" style="margin:0">${esc(s.en)}</p>`:''}
    <div id="dg" class="list"><div class="hint">Cargando diagrama…</div></div><p class="sec-h">${ps.length} piezas · # = lugar en el diagrama</p>
    <div class="list">${ps.map(p=>itemHTML(p,`<span class="hint">#${esc(p.ref)}</span>`)).join('')}</div>`;
    diagrams(s.i).then(ds=>{const el=$('#dg');if(!el)return;el.innerHTML=ds.length?ds.map((u,k)=>`<button class="diag-btn" data-zoom="${s.i}" data-zk="${k}"><img src="${u}" alt="Diagrama de ${esc(s.es)}"><em>Toca para ampliar</em></button>`).join(''):'<div class="hint">Sin diagrama.</div>'});return}
  if(st.catView){const ss=SECS.filter(s=>s.cat===st.catView);
    view.innerHTML=`<button class="back" data-back="cat">‹ Categorías</button><h2 class="title">${esc(st.catView)}</h2>${ss.map(s=>`<button class="cat" data-sec="${s.i}"><b>${esc(s.es)}</b><span>${s.n} ›</span></button>`).join('')}`;return}
  view.innerHTML=`<h2 class="title">Catálogo por diagrama</h2>${CATS.map(c=>`<button class="cat" data-gocat="${esc(c)}"><b>${esc(c)}</b><span>${SECS.filter(s=>s.cat===c).length} secciones ›</span></button>`).join('')}`}
function carCounts(c){const k={esta:0,quitada:0,vendida:0,mala:0,revisar:0,falta:0,na:0};UPN.forEach(pn=>{k[stOf(c,pn).s]++});return k}
const fmtDate=s=>{try{return new Date(s+(s.length===10?'T12:00:00':'')).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})}catch(e){return s}};
function vCarros(){
  if(st.car&&!CARS.find(c=>c.id===st.car))st.car=null;
  if(st.car&&st.carSec!=null)return vWalk();
  if(st.car&&st.carList)return vCarList();
  if(st.car)return vCar();
  const cs=carsSorted();
  view.innerHTML=`<h2 class="title">Carros</h2><p class="hint" style="margin:0">Cada carro es su propio estante. El de arriba es el más viejo: de ese conviene vender primero.</p>
  ${cs.length?`<div class="card">${cs.map(c=>{const k=carCounts(c);return `<button class="carrow" data-car="${c.id}" style="width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none">
    <span class="carside"><span class="carcode">${esc(c.code)}</span>${c.foto?`<img class="carpic" src="${c.foto}" alt="">`:''}</span><span style="min-width:0"><b>${esc([c.year,c.trim,EXT[c.color]||c.color].filter(Boolean).join(' · '))}</b><br><span class="hint">${c.llegada?'Llegó '+fmtDate(c.llegada):'Sin fecha de llegada'}${c.vin?' · VIN …'+esc(c.vin.slice(-6)):''}</span></span>
    <span style="text-align:right"><span class="st st-esta">${k.esta+k.quitada} disp.</span><br>${k.revisar?`<span class="st st-revisar" style="margin-top:4px">${k.revisar} por revisar</span>`:''}</span></button>`}).join('')}</div>`:'<div class="card"><b>Aún no hay carros.</b></div>'}
