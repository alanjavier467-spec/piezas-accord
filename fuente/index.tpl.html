<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piezas Accord</title>
<meta name="theme-color" content="#15191B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Piezas">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
__CSS__
</style>
</head>
<body>
<div id="login" class="wrap login" hidden>
  <div class="card">
    <h1>Piezas <span>Accord</span></h1>
    <p class="hint" style="margin:0" id="l-hint">Entra con tu usuario y tu PIN de 4 números.</p>
    <label class="f" for="l-email">Usuario<input id="l-email" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
    <label class="f" for="l-pass"><span id="l-plabel">PIN (4 números)</span><input id="l-pass" type="password" autocomplete="current-password" inputmode="numeric"></label>
    <label class="f" for="l-pass2" id="l-p2box" hidden>Repite tu PIN<input id="l-pass2" type="password" inputmode="numeric" autocomplete="new-password"></label>
    <button class="btn" id="l-go">Entrar</button>
    <button class="btn ghost" id="l-signup">Soy nuevo: crear mi cuenta</button>
    <button class="btn ghost" id="l-new" hidden>Crear mi cuenta de dueño</button>
    <button class="btn ghost" id="l-reset" hidden>Olvidé mi contraseña</button>
    <div class="status" id="l-status"></div>
  </div>
</div>

<div id="app" hidden>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Piezas <span>Accord</span></h1><span class="right"><span class="netchip" id="net">En línea</span><button class="hdr-btn" id="menu-btn" aria-label="Menú">☰</button></span></div>
    <label class="search" for="q">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Número de parte, nombre en español o inglés">
      <button id="qx" type="button" aria-label="Borrar búsqueda" hidden>×</button>
    </label>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<nav class="tabs" aria-label="Secciones">
  <div class="wrap">
    <button data-tab="buscar" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Buscar</button>
    <button data-tab="catalogo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>Catálogo</button>
    <button data-tab="carros"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 16h14M3 16l2-6 3-4h8l3 4 2 6v3H3z"/><circle cx="7.5" cy="16.5" r="1.5"/><circle cx="16.5" cy="16.5" r="1.5"/></svg>Carros</button>
    <button data-tab="carrito"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Comanda<span class="badge" id="badge" hidden>0</span></button>
    <button data-tab="ventas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Ventas</button>
  </div>
</nav>
<div id="sheet" class="sheet" hidden></div>
<div id="zoom" class="zoom" hidden></div>
</div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,updatePassword,sendPasswordResetEmail,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,setDoc,addDoc,deleteDoc,getDoc,getDocs,query,where,orderBy,limit,writeBatch,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const CFG=__FBCONFIG__;
const OWNER='alanjavier467@gmail.com';
const normUser=u=>String(u||'').trim().toLowerCase().normalize('NFC');
async function userEmail(u){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(normUser(u)));return 'u'+[...new Uint8Array(h)].slice(0,16).map(b=>b.toString(16).padStart(2,'0')).join('')+'@usuarios.piezas-accord.app'}
const pinPass=p=>'pin-'+p+'-pz';
const okPin=p=>/^\d{4}$/.test(p);
const fb=initializeApp(CFG);
const auth=getAuth(fb);
const fs=initializeFirestore(fb,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

const D=await fetch('data.json').then(r=>r.json());
const SECS=D.secs, PARTS=D.parts;
const $=s=>document.querySelector(s);
const view=$('#view'), sheet=$('#sheet'), zoom=$('#zoom'), qIn=$('#q'), qx=$('#qx');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'');
const money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});
const CATS=[...new Set(SECS.map(s=>s.cat))];
const VERSION='__VERSION__';
const BYPN={};PARTS.forEach((p,i)=>{p.i=i;p.key=norm(p.es+' '+p.en+' '+SECS[p.s].es+' '+SECS[p.s].en+' '+p.n);p.pnk=p.pn.replace(/-/g,'').toLowerCase();if(!BYPN[p.pn])BYPN[p.pn]=p});
const UPN=Object.keys(BYPN);
const EXT={'NH731P':'Negro cristal perlado','NH883P':'Blanco platino perlado','NH830M':'Plata lunar metálico','NH797M':'Gris acero metálico','R94':'Rojo San Marino','B575P':'Azul noche perlado'};
PARTS.forEach(p=>{const m=(p.es+' '+p.en).match(/\*(NH731P|NH883P|NH830M|NH797M|R94|B575P)\*/);p.ext=m?m[1]:null});
// números por año/versión: p.y = {'18':..,'19':..,'20T':..}; '' = no existe en esa versión; sin clave = mismo número
const YL={'18':'2018 1.5T','19':'2019 1.5T','20':'2020 1.5T','20T':'2020 2.0T'};const YK=['18','19','20','20T'];
PARTS.forEach(p=>{if(p.y)p.ypk=Object.values(p.y).flat().filter(Boolean).map(x=>x.replace(/-/g,'').toLowerCase()).join(' ')});
function verOf(c){if(!c)return null;if(c._v!==undefined)return c._v;let r=null;
  if(c.ver)r=c.ver;else{const v=(c.vin||'').toUpperCase().trim();
    if(v.length===17){const yc=v[9];const yr=yc==='J'?'18':yc==='K'?'19':/[L-N]/.test(yc)?'20':null;r=v[5]==='2'?'20T':yr}
    if(!r){const y=String(c.year||'');r=y==='2018'?'18':y==='2019'?'19':/^20(2\d)$/.test(y)?'20':null}}
  try{Object.defineProperty(c,'_v',{value:r,enumerable:false})}catch(e){}return r}
function yNum(p,ver){if(!ver||ver==='20'||!p.y||!(ver in p.y))return p.pn;const y=p.y[ver];return y===''?null:[].concat(y).join(' / ')}
function naWhy(c,p){return p&&p.ext&&c.color&&p.ext!==c.color?'otro color':'no viene en esta versión'}
const STS=[['esta','En el carro'],['quitada','Quitada y guardada'],['vendida','Vendida'],['mala','Dañada'],['revisar','Por revisar'],['falta','No está']];
const STL=Object.fromEntries(STS.concat([['na','No aplica']]));
const AVAIL=s=>s==='esta'||s==='quitada';
const EMP_MAX_DISC=10;

// ---- estado ----
let ME=null, OWN=false, PROFILE=null;
let CARS=[], PRIV={}, EST={}, PRICE={}, SALES=[], ALT={}, USERS=[];
let FOTOS={}, FOTOLIST=[], EXTRAS=[], NEG={};
const priceOf=pn=>{const v=PRICE[pn];return v?v:((BYPN[pn]||{}).sp||0)};
const isSug=pn=>!PRICE[pn];
const xById=id=>EXTRAS.find(x=>x.id===id);
const xAvail=x=>x&&x.status!=='vendida'&&(x.qty||0)>0;
const st={tab:'buscar',q:'',cat:'',onlyStock:false,limit:40,catView:null,secView:null,car:null,carSec:null};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let CART=LS.get('comanda',[]); let DISC=Object.assign({mode:'pct',pct:0,amt:'',target:''},LS.get('desc',{})); let CLIENTE=LS.get('cliente','');
function saveCart(){LS.set('comanda',CART);LS.set('desc',DISC);LS.set('cliente',CLIENTE);const b=$('#badge');const n=CART.reduce((a,l)=>a+l.qty,0);b.hidden=!n;b.textContent=n}
const carsSorted=()=>CARS.slice().sort((a,b)=>(a.llegada||'9999').localeCompare(b.llegada||'9999')||a.code.localeCompare(b.code));
const units=p=>p&&p.cr?p.cr:1;
function stOf(car,pn){const p=BYPN[pn];if(p&&p.ext&&car.color&&p.ext!==car.color)return {s:'na',n:0};
  if(p&&p.y){const vr=verOf(car);if(vr&&p.y[vr]==='')return {s:'na',n:0}}
  const e=(EST[car.id]||{})[pn];const def=car.def||'esta';
  if(!e)return {s:def,n:AVAIL(def)?units(p):0};
  return {s:e.s,n:e.n!=null?e.n:(AVAIL(e.s)?units(p):0)}}
const availCars=pn=>carsSorted().map(c=>({c,x:stOf(c,pn)})).filter(o=>AVAIL(o.x.s)&&o.x.n>0);
const inCart=(pn,carId)=>CART.filter(l=>l.pn===pn&&l.car===carId).reduce((a,l)=>a+l.qty,0);
const carCode=id=>(CARS.find(c=>c.id===id)||{}).code||'?';
const ubiOf=(carId,pn)=>((EST[carId]||{})[pn]||{}).u||'';
const UBIS=()=>{const set=new Set(['T-1','T-2','T-3','T-4','T-5','T-6','T-7','T-8','G-1','G-2','G-3','G-4']);Object.values(EST).forEach(m=>Object.values(m||{}).forEach(v=>v&&v.u&&set.add(v.u)));EXTRAS.forEach(x=>x.ubi&&set.add(x.ubi));return [...set].sort()};
const ubiList=()=>`<datalist id="ubis">${UBIS().map(u=>`<option value="${esc(u)}">`).join('')}</datalist>`;
const maxDuenos=()=>Math.min(4,Math.max(1,+(NEG.maxDuenos||2)));
const nDuenos=()=>1+USERS.filter(u=>u.role==='dueño'&&u.active).length;
const altsOf=pn=>Object.entries(ALT).filter(([k,v])=>v.pn===pn).map(([k])=>k);

// ---- imágenes ----
const bundles={};const bundle=i=>bundles[i]||(bundles[i]=fetch('p/'+i+'.json').then(r=>r.json()).catch(()=>({})));
const dcache={};const diagrams=i=>dcache[i]||(dcache[i]=fetch('d/'+i+'.json').then(r=>r.json()).catch(()=>[]));
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const img=e.target;io.unobserve(img);bundle(+img.dataset.s).then(b=>{const u=b[img.dataset.k];if(u)img.src=u;else img.alt='Sin foto'})})},{rootMargin:'300px'});
const hookImgs=root=>root.querySelectorAll('img[data-k]').forEach(i=>io.observe(i));
const imgTag=p=>`<img data-s="${p.s}" data-k="${esc(p.pn+'|'+p.ref)}" alt="">`;
const phTag=p=>{const f=FOTOS[p.pn];return f&&f.length?`<img src="${f[0].thumb}" alt="Foto real">`:imgTag(p)};

// ---- búsqueda ----
function search(q){const nq=norm(q).trim();if(!nq)return null;const compact=nq.replace(/[\s-]/g,'');const words=nq.split(/\s+/).filter(Boolean);const out=[];
  const altHits=new Set();if(compact.length>=3)for(const [a,v] of Object.entries(ALT)){if(a.toLowerCase().includes(compact))altHits.add(v.pn)}
  for(const p of PARTS){let sc=0;
    if(compact.length>=3&&/\d/.test(compact)&&p.pnk.includes(compact))sc=p.pnk.startsWith(compact)?100:80;
    else if(compact.length>=3&&/\d/.test(compact)&&p.ypk&&p.ypk.includes(compact))sc=85;
    else if(altHits.has(p.pn))sc=90;
    else if(words.every(w=>p.key.includes(w))){sc=10;if(norm(p.es).startsWith(words[0]))sc+=6;if(norm(p.es).includes(nq))sc+=4;if(norm(p.en).includes(nq))sc+=3}
    if(sc)out.push([sc,p])}
  out.sort((a,b)=>b[0]-a[0]||a[1].es.length-b[1].es.length);return out.map(x=>x[1])}
function availHTML(pn){if(!CARS.length)return '';const a=availCars(pn);if(!a.length)return '<span class="stock n">Sin existencia</span>';
  return `<span class="avail">${a.map(o=>`<span class="cb ${o.x.s==='quitada'?'q':''}">${esc(o.c.code)}${o.x.n>1?'×'+o.x.n:''}${ubiOf(o.c.id,pn)?' · '+esc(ubiOf(o.c.id,pn)):''}</span>`).join('')}</span>`}
function priceHTML(pn){const pr=priceOf(pn);return pr?`<span class="price">${money(pr)}</span>${isSug(pn)?'<span class="sug">sugerido</span>':''}`:'<span class="price none">Sin precio</span>'}
function itemHTML(p,pre){const nf=(FOTOS[p.pn]||[]).length;
  return `<button class="item" data-open="${p.i}"><span class="ph">${phTag(p)}</span>
   <span class="t">${pre||''}${nf?'<span class="realtag">📷 foto real</span>':''}<span class="pn">${esc(p.pn)}</span><span class="es">${esc(p.es)}</span>${p.en?`<span class="en">${esc(p.en)}</span>`:''}</span>
   <span class="r">${priceHTML(p.pn)}${availHTML(p.pn)}</span></button>`}
function xItemHTML(x){const f=FOTOS['X:'+x.id]||[];
  return `<button class="item" data-openx="${esc(x.id)}"><span class="ph">${f.length?`<img src="${f[0].thumb}" alt="">`:'📦'}</span>
   <span class="t"><span class="realtag">Agregada</span>${x.num?`<span class="pn">${esc(x.num)}</span>`:''}<span class="es">${esc(x.name)}</span>${x.cond?`<span class="en">${esc(x.cond)}</span>`:''}</span>
   <span class="r">${x.price?`<span class="price">${money(x.price)}</span>${x.sug?'<span class="sug">sugerido</span>':''}`:'<span class="price none">Sin precio</span>'}${xAvail(x)?`<span class="avail"><span class="cb">${esc(x.car?carCode(x.car):'Bodega')}${x.qty>1?'×'+x.qty:''}</span></span>`:'<span class="stock n">Vendida</span>'}</span></button>`}
function searchExtras(q){const nq=norm(q).trim();if(!nq)return [];const c=nq.replace(/[\s-]/g,'');const w=nq.split(/\s+/);
  return EXTRAS.filter(x=>{const k=norm(x.name+' '+x.num+' '+x.cond+' '+(x.nota||''));return (c.length>=3&&norm(x.num).replace(/[\s-]/g,'').includes(c))||w.every(t=>k.includes(t))})}
function renderList(arr){if(!arr.length)return '<div class="empty">No encontré piezas con eso en el catálogo. Prueba otra palabra, en inglés, o parte del número.<br><br><button class="btn alt" data-intake style="font-size:17px;padding:14px">📷 Agregar pieza con foto</button></div>';
  return `<div class="list">${arr.slice(0,st.limit).map(p=>itemHTML(p)).join('')}</div>`+(arr.length>st.limit?`<button class="more" data-more>Mostrar más (${arr.length-st.limit} restantes)</button>`:'')}

// ---- vistas ----
function vBuscar(){let arr=search(st.q);
  const chips=`<div class="row">${['',...CATS].map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${st.cat===c}">${c?esc(c.split(' / ')[0]):'Todo'}</button>`).join('')}<button class="chip" data-stockonly aria-pressed="${st.onlyStock}">Solo lo que tengo</button></div>`;
  if(!arr){if(st.onlyStock||st.cat)arr=PARTS;else{
    const tips=['faro','headlight','espejo','sensor','bomba','defensa','33100','módulo','rin','asiento'];
    view.innerHTML=`<button class="btn alt" data-intake style="width:100%;margin-bottom:10px;font-size:17px;padding:14px">📷 Agregar pieza con foto</button>`+chips+(EXTRAS.filter(xAvail).length?`<p class="sec-h">Piezas que agregaste con foto (${EXTRAS.filter(xAvail).length})</p><div class="list">${EXTRAS.filter(xAvail).slice(0,6).map(xItemHTML).join('')}</div>`:'')+`<div class="card"><b>Escribe arriba lo que buscas.</b><p class="hint" style="margin:.4em 0 0">Número completo o un pedazo (con o sin guiones), nombre en español o en inglés, o el número que trae la pieza si lo guardaron como alterno.</p><div class="row" style="margin-top:8px">${tips.map(t=>`<button class="chip" data-try="${t}">${t}</button>`).join('')}</div></div>
    <div id="offline-card"></div>
    <p class="sec-h">O explora por categoría</p>${CATS.map(c=>`<button class="cat" data-gocat="${esc(c)}"><b>${esc(c)}</b><span>${PARTS.filter(p=>SECS[p.s].cat===c).length} piezas ›</span></button>`).join('')}`;renderOffline();return}}
  if(st.cat)arr=arr.filter(p=>SECS[p.s].cat===st.cat);
  if(st.onlyStock)arr=arr.filter(p=>availCars(p.pn).length);
  const seen=new Set();arr=arr.filter(p=>!seen.has(p.pn)&&seen.add(p.pn));
  const xs=st.q?searchExtras(st.q).filter(x=>!st.onlyStock||xAvail(x)):[];
  view.innerHTML=chips+(xs.length?`<p class="sec-h">Agregadas por ti con foto</p><div class="list">${xs.map(xItemHTML).join('')}</div><p class="sec-h">Catálogo</p>`:'')+`<p class="hint">${arr.length} ${arr.length===1?'resultado':'resultados'}</p>`+renderList(arr)}
function vCatalogo(){
  if(st.secView!=null){const s=SECS[st.secView];const ps=PARTS.filter(p=>p.s===s.i);
    view.innerHTML=`<button class="back" data-back="sec">‹ ${esc(s.cat)}</button><h2 class="title">${esc(s.es)}</h2>${s.en?`<p class="hint" style="margin:0">${esc(s.en)}</p>`:''}
    <div id="dg" class="list"><div class="hint">Cargando diagrama…</div></div><p class="sec-h">${ps.length} piezas · # = lugar en el diagrama</p>
    <div class="list">${ps.map(p=>itemHTML(p,`<span class="hint">#${esc(p.ref)}</span>`)).join('')}</div>`;
    diagrams(s.i).then(ds=>{const el=$('#dg');if(!el)return;el.innerHTML=ds.length?ds.map((u,k)=>`<button class="diag-btn" data-zoom="${s.i}" data-zk="${k}"><img src="${u}" alt="Diagrama de ${esc(s.es)}"><em>Toca para ampliar</em></button>`).join(''):'<div class="hint">Sin diagrama.</div>'});return}
  if(st.catView){const ss=SECS.filter(s=>s.cat===st.catView);
    view.innerHTML=`<button class="back" data-back="cat">‹ Categorías</button><h2 class="title">${esc(st.catView)}</h2>${ss.map(s=>`<button class="cat" data-sec="${s.i}"><b>${esc(s.es)}</b><span>${s.n} ›</span></button>`).join('')}`;return}
  view.innerHTML=`<h2 class="title">Catálogo por diagrama</h2>${CATS.map(c=>`<button class="cat" data-gocat="${esc(c)}"><b>${esc(c)}</b><span>${SECS.filter(s=>s.cat===c).length} secciones ›</span></button>`).join('')}`}
function carCounts(c){const k={esta:0,quitada:0,vendida:0,mala:0,revisar:0,falta:0,na:0};UPN.forEach(pn=>{k[stOf(c,pn).s]++});return k}
const fmtDate=s=>{try{return new Date(s+(s.length===10?'T12:00:00':'')).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})}catch(e){return s}};
function vCarros(){
  if(st.car&&!CARS.find(c=>c.id===st.car))st.car=null;
  if(st.car&&st.carSec!=null)return vWalk();
  if(st.car&&st.carList)return vCarList();
  if(st.car)return vCar();
  const cs=carsSorted();
  view.innerHTML=`<h2 class="title">Carros</h2><p class="hint" style="margin:0">Cada carro es su propio estante. El de arriba es el más viejo: de ese conviene vender primero.</p>
  ${cs.length?`<div class="card">${cs.map(c=>{const k=carCounts(c);return `<button class="carrow" data-car="${c.id}" style="width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none">
    <span class="carside"><span class="carcode">${esc(c.code)}</span>${c.foto?`<img class="carpic" src="${c.foto}" alt="">`:''}</span><span style="min-width:0"><b>${esc([c.year,c.trim,EXT[c.color]||c.color].filter(Boolean).join(' · '))}</b><br><span class="hint">${c.llegada?'Llegó '+fmtDate(c.llegada):'Sin fecha de llegada'}${c.vin?' · VIN …'+esc(c.vin.slice(-6)):''}</span></span>
    <span style="text-align:right"><span class="st st-esta">${k.esta+k.quitada} disp.</span><br>${k.revisar?`<span class="st st-revisar" style="margin-top:4px">${k.revisar} por revisar</span>`:''}</span></button>`}).join('')}</div>`:'<div class="card"><b>Aún no hay carros.</b></div>'}
  ${OWN?`<details class="card"><summary><b>Agregar carro</b></summary>${carForm({})}</details>`:''}`}
function carForm(c){const pv=PRIV[c.id]||{};return `<div class="form" style="margin-top:10px">

let LAYERS=0;
function showSheet(){if(sheet.hidden){LAYERS++;history.pushState({layer:LAYERS},'')}sheet.hidden=false}
function showZoom(){if(zoom.hidden){LAYERS++;history.pushState({layer:LAYERS},'')}zoom.hidden=false}
function doCloseSheet(){sheet.hidden=true;SHEET='';openIdx=null;openX=null;document.body.style.overflow='';render()}
function closeTop(){if(LAYERS>0){history.back();return}if(!zoom.hidden)zoom.hidden=true;else if(!sheet.hidden)doCloseSheet()}
function closeSheet(){if(sheet.hidden&&zoom.hidden)return;if(LAYERS>0){history.go(-LAYERS);return}zoom.hidden=true;if(!sheet.hidden)doCloseSheet()}
window.addEventListener('popstate',e=>{const target=(e.state&&e.state.layer)||0;const was=LAYERS;LAYERS=Math.min(LAYERS,target);if(was-LAYERS>=2){zoom.hidden=true;if(!sheet.hidden)doCloseSheet();return}if(!zoom.hidden){zoom.hidden=true;return}if(!sheet.hidden)doCloseSheet()});
function pinch(area,get,set){let d0=0,z0=1;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  area.addEventListener('touchstart',e=>{if(e.touches.length===2){d0=dist(e.touches);z0=get()}},{passive:true});
  area.addEventListener('touchmove',e=>{if(e.touches.length===2&&d0){e.preventDefault();set(z0*dist(e.touches)/d0)}},{passive:false});
  area.addEventListener('touchend',()=>{d0=0},{passive:true})}
function openZoom(si,k,ref){diagrams(si).then(ds=>{if(!ds.length)return;let z=1;const s=SECS[si];
  zoom.innerHTML=`<div class="zbar"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ref?'Busca el #'+esc(ref)+' · ':''}${esc(s.es)}</span><span class="row" style="flex-wrap:nowrap"><button data-z="-1" aria-label="Alejar">−</button><button data-z="1" aria-label="Acercar">+</button>${ds.length>1?`<button data-zn>${k+1}/${ds.length}</button>`:''}<button data-zclose>✕ Cerrar</button></span></div><div class="zarea"><img alt="Diagrama"></div><button class="zx" data-zclose>✕ Cerrar diagrama</button>`;
  const img=zoom.querySelector('img'),area=zoom.querySelector('.zarea');const apply=()=>{img.style.width=(z*100)+'%'};img.src=ds[k];apply();showZoom();

   :OFF.state==='run'?`<b>Guardando fotos para usar sin señal… ${Math.round(OFF.done/OFF.total*100)}%</b><p class="hint" style="margin:.3em 0 0">Déjala abierta con señal (de preferencia WiFi) hasta que llegue a 100%.</p>`
   :OFF.state==='err'?'<b>Faltan fotos por guardar</b><p class="hint" style="margin:.3em 0 0">Se reintentará cuando haya señal.</p>':'';
  ['#offline-card','#offline-card2'].forEach(id=>{const el=$(id);if(el){el.innerHTML=html;el.className=html&&id==='#offline-card'?'card':el.className;el.hidden=!html}})}
async function prefetchAll(){if(!('caches' in window))return;const urls=['data.json'];for(let i=0;i<SECS.length;i++){urls.push('p/'+i+'.json','d/'+i+'.json')}
  const c=await caches.open('piezas-data-v1');let missing=[];for(const u of urls){if(!(await c.match(u)))missing.push(u)}
  OFF={done:urls.length-missing.length,total:urls.length,state:missing.length?'run':'ok'};renderOffline();if(!missing.length)return;
  for(const u of missing){try{const r=await fetch(u,{cache:'no-cache'});if(r.ok){await c.put(u,r.clone());OFF.done++;if(OFF.done%8===0)renderOffline()}}catch(e){OFF.state='err';renderOffline();return}}
  OFF.state='ok';renderOffline()}

let SIGNUP=false,SIGNING=false;
const isMail=()=>L.email.value.includes('@');
function loginMode(){const m=isMail();L.neu.hidden=L.email.value.trim().toLowerCase()!==OWNER;$('#l-reset').hidden=!m;$('#l-signup').hidden=m;

$('#l-go').addEventListener('click',async()=>{const u=L.email.value.trim(),p=L.pass.value.trim();

onAuthStateChanged(auth,async u=>{if(SIGNING)return;unsubs.forEach(f=>f());unsubs=[];ME=u;LOADED=new Set();PUBLAST=null;
