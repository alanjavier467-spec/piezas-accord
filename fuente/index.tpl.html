<body>

<div id="app" hidden>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Piezas <span>Accord</span></h1><span class="right"><span class="netchip" id="net">En línea</span><button class="hdr-btn" id="menu-btn" aria-label="Menú">☰</button></span></div>
    <label class="search" for="q">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

      <button id="qx" type="button" aria-label="Borrar búsqueda" hidden>×</button>

    <button data-tab="carrito"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Carrito<span class="badge" id="badge" hidden>0</span></button>
    <button data-tab="ventas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Ventas</button>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,updatePassword,sendPasswordResetEmail,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,setDoc,addDoc,deleteDoc,getDoc,getDocFromCache,getDocs,deleteField,query,where,orderBy,limit,writeBatch,runTransaction,serverTimestamp,increment,waitForPendingWrites} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const CFG=__FBCONFIG__;
const OWNER='__OWNER_EMAIL__';
const normUser=u=>String(u||'').trim().toLowerCase().normalize('NFC');
async function userEmail(u){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(normUser(u)));return 'u'+[...new Uint8Array(h)].slice(0,16).map(b=>b.toString(16).padStart(2,'0')).join('')+'@usuarios.piezas-accord.app'}
const pinPass=p=>'pin-'+p+'-pz';
const okPin=p=>/^(\d{4}|\d{6})$/.test(p);   // para entrar: los PIN viejos de 4 siguen sirviendo
const okPinNuevo=p=>/^\d{6}$/.test(p);       // PIN nuevo o cambiado: 6 números
let PIN4=false;try{PIN4=sessionStorage.getItem('pin4')==='1'}catch(e){}
const fb=initializeApp(CFG);
const auth=getAuth(fb);
const fs=initializeFirestore(fb,{ignoreUndefinedProperties:true,localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

const D=await fetch('data.json').then(r=>r.json());
const SECS=D.secs, PARTS=D.parts;
const $=s=>document.querySelector(s);
const view=$('#view'), sheet=$('#sheet'), zoom=$('#zoom'), qIn=$('#q'), qx=$('#qx');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'');
const money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});
const CATS=[...new Set(SECS.map(s=>s.cat))];
__BUSQUEDA__
const BUS=mkBuscador(norm,PARTS.map(p=>p.es+' '+p.en).concat(SECS.map(s=>s.es+' '+s.en)));let CORR={};
const VERSION='__VERSION__';
const BYPN={};PARTS.forEach((p,i)=>{p.i=i;p.key=norm(p.es+' '+p.en+' '+SECS[p.s].es+' '+SECS[p.s].en+' '+p.n);p.pnk=p.pn.replace(/-/g,'').toLowerCase();if(!BYPN[p.pn])BYPN[p.pn]=p});
const UPN=Object.keys(BYPN);
const EXT={'NH731P':'Negro cristal perlado','NH883P':'Blanco platino perlado','NH830M':'Plata lunar metálico','NH797M':'Gris acero metálico','R94':'Rojo San Marino','B575P':'Azul noche perlado'};
PARTS.forEach(p=>{const m=(p.es+' '+p.en).match(/\*(NH731P|NH883P|NH830M|NH797M|R94|B575P)\*/);p.ext=m?m[1]:null});
// números por año/versión: p.y = {'18':..,'19':..,'20T':..}; '' = no existe en esa versión; sin clave = mismo número
const YL={'18':'2018 1.5T','19':'2019 1.5T','20':'2020 1.5T','20T':'2020 2.0T'};const YK=['18','19','20','20T'];
PARTS.forEach(p=>{if(p.y)p.ypk=Object.values(p.y).flat().filter(Boolean).map(x=>x.replace(/-/g,'').toLowerCase()).join(' ')});
function verOf(c){if(!c)return null;if(c._v!==undefined)return c._v;let r=null;
  if(c.ver)r=c.ver;else{const v=(c.vin||'').toUpperCase().trim();
    if(v.length===17){const yc=v[9];const yr=yc==='J'?'18':yc==='K'?'19':/[L-N]/.test(yc)?'20':null;r=v[5]==='2'?'20T':yr}
    if(!r){const y=String(c.year||'');r=y==='2018'?'18':y==='2019'?'19':/^20(2\d)$/.test(y)?'20':null}}
  try{Object.defineProperty(c,'_v',{value:r,enumerable:false})}catch(e){}return r}
function yNum(p,ver){if(ver==='20'&&p.y&&p.y['20']==='')return null;if(!ver||ver==='20'||!p.y||!(ver in p.y))return p.pn;const y=p.y[ver];return y===''?null:[].concat(y).join(' / ')}
// Accord 2021–2022 (facelift): estas secciones cambiaron (rines, faro de niebla, faro, facia delantera, parrilla); sin dato del usuario quedan "Por revisar"
const FACE21=new Set([35,51,57,109,111]);
const es21=c=>{const v=(c.vin||'').toUpperCase().trim();return (v.length===17&&/[MN]/.test(v[9]))||+c.year>=2021};
function naWhy(c,p){return p&&p.ext&&c.color&&p.ext!==c.color?'otro color':'no viene en esta versión'}
const STS=[['esta','En el carro'],['quitada','Quitada y guardada'],['apartada','Apartada'],['vendida','Vendida'],['mala','Dañada'],['revisar','Por revisar'],['falta','No está']];
const STL=Object.fromEntries(STS.concat([['na','No aplica']]));
const AVAIL=s=>s==='esta'||s==='quitada';
const EMP_MAX_DISC=10;

// ---- estado ----
let ME=null, OWN=false, PROFILE=null;
let CARS=[], PRIV={}, EST={}, PRICE={}, SALES=[], CANCELADAS=[], ALT={}, USERS=[], LOTES={};
let FOTOS={}, FOTOLIST=[], EXTRAS=[], NEG={}, CLIENTES=[];
const TC_DEF=18.7,SUBE_DEF=50;
// ---- promoción (Buen Fin, Navidad…): % de descuento por fechas, a todo lo disponible o solo a piezas elegidas ----
const PROMO_DEF={n:'Buen Fin',pct:15,ini:'2026-11-13',fin:'2026-11-17',todo:true,sel:[]};
const promoCfg=()=>Object.assign({},PROMO_DEF,NEG.promo||{});
const promoAct=()=>{const p=NEG.promo;if(!p||!p.on||!(+p.pct>0)||!p.ini||!p.fin)return null;const a=new Date(p.ini+'T00:00:00-06:00'),b=new Date(p.fin+'T23:59:59-06:00'),n=Date.now();return n>=a&&n<=b?p:null};
const enPromo=k=>{const p=promoAct();return !!p&&(p.todo||(p.sel||[]).includes(k))};
const precioV=(k,base)=>base&&enPromo(k)?Math.max(10,Math.round(base*(1-NEG.promo.pct/100)/10)*10):base;
const promoFin=()=>{const p=NEG.promo;return p?new Date(p.fin+'T12:00:00-06:00').toLocaleDateString('es-MX',{day:'numeric',month:'long'}):''};
const subePct=()=>NEG.subeSug!=null&&NEG.subeSug!==''?+NEG.subeSug:SUBE_DEF;const fSug=()=>1+subePct()/100;const tcNow=()=>+NEG.tc||TC_DEF;
const nice=v=>!v?0:v<200?Math.max(10,Math.round(v/10)*10):Math.round(v/50)*50;
const sugOf=pn=>nice(((BYPN[pn]||{}).sp||0)*fSug());
const newOf=p=>p&&p.lp?Math.round(p.lp*tcNow()/10)*10:0;
const priceOf=pn=>{const v=PRICE[pn];return v?v:sugOf(pn)};
const dLocal=d=>{const x=d?new Date(d):new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const PAGOS=['Efectivo','Transferencia','Tarjeta'];let PAGO='Efectivo';let CORTES=[],RESENAS=[];
const isSug=pn=>!PRICE[pn];
const xById=id=>EXTRAS.find(x=>x.id===id);
const xAvail=x=>x&&x.status!=='vendida'&&(x.qty||0)>0;
const st={tab:'buscar',q:'',cat:'',onlyStock:false,limit:40,catView:null,secView:null,car:null,carSec:null};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let CART=LS.get('comanda',[]); let DISC=Object.assign({mode:'pct',pct:0,amt:'',target:''},LS.get('desc',{})); let CLIENTE=LS.get('cliente',''); let CLIID=LS.get('cliid','');let CLIQ='';PAGO=LS.get('pago','Efectivo');
const ptsFor=t=>Math.floor((+t||0)/100);
function saveCart(){LS.set('comanda',CART);LS.set('desc',DISC);LS.set('cliente',CLIENTE);const b=$('#badge');const n=CART.reduce((a,l)=>a+l.qty,0);b.hidden=!n;b.textContent=n}
const carsSorted=()=>CARS.slice().sort((a,b)=>(a.llegada||'9999').localeCompare(b.llegada||'9999')||a.code.localeCompare(b.code));
const units=p=>p&&p.cr?p.cr:1;
function stOf(car,pn,mm){const p=BYPN[pn];if(p&&p.ext&&car.color&&p.ext!==car.color)return {s:'na',n:0};
  if(p&&p.y){const vr=verOf(car);if(vr&&p.y[vr]==='')return {s:'na',n:0}}
  const e=((mm||EST[car.id])||{})[pn];const def=car.def||'esta';
  if(!e&&p&&FACE21.has(p.s)&&es21(car))return {s:'revisar',n:0};
  if(e&&e.s==='apartada'&&e.ap&&Date.parse(e.ap.v)<Date.now())return {s:AVAIL(e.prev)?e.prev:'quitada',n:e.n||units(p)};
  if(!e)return {s:def,n:AVAIL(def)?units(p):0};
  return {s:e.s,n:e.n!=null?e.n:(AVAIL(e.s)?units(p):0)}}
const availCars=pn=>carsSorted().map(c=>({c,x:stOf(c,pn)})).filter(o=>AVAIL(o.x.s)&&o.x.n>0);
const inCart=(pn,carId)=>CART.filter(l=>l.pn===pn&&l.car===carId).reduce((a,l)=>a+l.qty,0);
const carCode=id=>(CARS.find(c=>c.id===id)||{}).code||'?';
const ubiOf=(carId,pn)=>((EST[carId]||{})[pn]||{}).u||'';
const UBIS=()=>{const set=new Set(['T-1','T-2','T-3','T-4','T-5','T-6','T-7','T-8','G-1','G-2','G-3','G-4']);Object.values(EST).forEach(m=>Object.values(m||{}).forEach(v=>v&&v.u&&set.add(v.u)));EXTRAS.forEach(x=>x.ubi&&set.add(x.ubi));return [...set].sort()};
const ubiList=()=>`<datalist id="ubis">${UBIS().map(u=>`<option value="${esc(u)}">`).join('')}</datalist>`;
const maxDuenos=()=>Math.min(4,Math.max(1,+(NEG.maxDuenos||2)));
const nDuenos=()=>1+USERS.filter(u=>u.role==='dueño'&&u.active).length;
const altsOf=pn=>Object.entries(ALT).filter(([k,v])=>v.pn===pn).map(([k])=>k);

// ---- imágenes ----
const bundles={};const bundle=i=>bundles[i]||(bundles[i]=fetch('p/'+i+'.json').then(r=>r.json()).catch(()=>({})));
const dcache={};const diagrams=i=>dcache[i]||(dcache[i]=fetch('d/'+i+'.json').then(r=>r.json()).catch(()=>[]));
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const img=e.target;io.unobserve(img);bundle(+img.dataset.s).then(b=>{const u=b[img.dataset.k];if(u)img.src=u;else img.alt='Sin foto'})})},{rootMargin:'300px'});
const hookImgs=root=>root.querySelectorAll('img[data-k]').forEach(i=>io.observe(i));
const imgTag=p=>`<img data-s="${p.s}" data-k="${esc(p.pn+'|'+p.ref)}" alt="">`;
// ---- fotos reales "por pantalla" (como los chunks de Minecraft) ----
// La lista de fotos (sin imagen) viene de un solo documento: indice/fotos. Cada miniatura se baja de fotos/{id}
// solo cuando aparece en pantalla, y se guarda en el teléfono para no volver a pedirla.
const THUMB={},TQ={};let IDXM={};
const fmeta=v=>({pn:v.pn||'',cond:v.cond||'',nota:v.nota||'',car:v.car||'',date:v.date||'',by:v.by||'',byName:v.byName||''});
const idxSet=(id,v)=>setDoc(doc(fs,'indice','fotos'),{m:{[id]:v}},{merge:true}).catch(e=>console.warn('indice',e));
function thumbOf(id){if(THUMB[id]!=null)return Promise.resolve(THUMB[id]);if(TQ[id])return TQ[id];
  return TQ[id]=(async()=>{let d=null;try{d=await getDocFromCache(doc(fs,'fotos',id))}catch(e){}
    if(!d||!d.exists()){try{d=await getDoc(doc(fs,'fotos',id))}catch(e){d=null}}
    if(d&&!d.exists()&&IDXM[id]&&navigator.onLine)idxSet(id,deleteField()); // la foto ya no existe: se quita de la lista
    const u=d&&d.exists()?((d.data()||{}).thumb||''):'';if(d)THUMB[id]=u;delete TQ[id];return u})()}
const thumbImg=(id,alt,extra)=>`<img data-tf="${esc(id)}"${THUMB[id]?` src="${THUMB[id]}"`:''} alt="${alt||''}"${extra||''}>`;
const tio=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const im=e.target;tio.unobserve(im);thumbOf(im.dataset.tf).then(u=>{if(u&&!im.dataset.full&&!im.getAttribute('src'))im.src=u})}),{rootMargin:'300px'});
const watchThumbs=root=>{if(root&&root.querySelectorAll)root.querySelectorAll('img[data-tf]:not([src])').forEach(i=>tio.observe(i))};
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(n.matches('img[data-tf]:not([src])'))tio.observe(n);else watchThumbs(n)}))).observe(document.body,{childList:true,subtree:true});
// arma o completa el índice: la primera vez lo arma el dueño leyendo todas las fotos (una sola vez);
// después cualquier miembro agrega solo las fotos nuevas que suban teléfonos con la app vieja o lotes
let IDXSYNC=false;
async function syncIdx(d){if(IDXSYNC||!navigator.onLine)return;const x=d.exists()?d.data():null;if(!x&&!OWN)return;IDXSYNC=true;
  try{const q=x&&x.v===1&&x.ult?query(collection(fs,'fotos'),where('date','>',x.ult)):collection(fs,'fotos');const sn=await getDocs(q);
    const m={};let ult=(x&&x.ult)||'';sn.docs.forEach(f=>{const v=f.data()||{};if(v.thumb)THUMB[f.id]=v.thumb;if(!x||!(x.m||{})[f.id])m[f.id]=fmeta(v);if((v.date||'')>ult)ult=v.date});
    if(!x||Object.keys(m).length||ult!==x.ult)await setDoc(doc(fs,'indice','fotos'),{v:1,ult,m},{merge:true})}catch(e){console.warn('indice',e);IDXSYNC=false}}
const phTag=p=>{const f=FOTOS[p.pn];return f&&f.length?thumbImg(f[0].id,'Foto real'):imgTag(p)};

// ---- búsqueda ----
function search(q){const nq=norm(q).trim();if(!nq)return null;const compact=nq.replace(/[\s-]/g,'');const words=nq.split(/\s+/).filter(Boolean);const out=[];const EX=BUS.expandir(nq);CORR=EX.corr;const cw=words.map(w=>CORR[w]||w),cq=cw.join(' ');
  const altHits=new Set();if(compact.length>=3)for(const [a,v] of Object.entries(ALT)){if(a.toLowerCase().includes(compact))altHits.add(v.pn)}
  for(const p of PARTS){let sc=0;
    if(compact.length>=3&&/\d/.test(compact)&&p.pnk.includes(compact))sc=p.pnk.startsWith(compact)?100:80;
    else if(compact.length>=3&&/\d/.test(compact)&&p.ypk&&p.ypk.includes(compact))sc=85;
    else if(altHits.has(p.pn))sc=90;
    else if(BUS.cumple(p.key,EX.grupos)){sc=10;const es=norm(p.es);if(es.startsWith(cw[0]))sc+=6;if(es.includes(cq))sc+=4;else if(cw.every(w=>es.includes(w)))sc+=2;if(norm(p.en).includes(cq))sc+=3}
    if(sc)out.push([sc,p])}
  out.sort((a,b)=>b[0]-a[0]||a[1].es.length-b[1].es.length);return out.map(x=>x[1])}
function availHTML(pn){if(!CARS.length)return '';const a=availCars(pn);if(!a.length)return '<span class="stock n">Sin existencia</span>';
  return `<span class="avail">${a.map(o=>`<span class="cb ${o.x.s==='quitada'?'q':''}">${esc(o.c.code)}${o.x.n>1?'×'+o.x.n:''}${ubiOf(o.c.id,pn)?' · '+esc(ubiOf(o.c.id,pn)):''}</span>`).join('')}</span>`}
function priceHTML(pn){const pr=priceOf(pn);return pr?`<span class="price">${money(pr)}</span>${isSug(pn)?'<span class="sug">sugerido</span>':''}`:'<span class="price none">Sin precio</span>'}
function itemHTML(p,pre){const nf=(FOTOS[p.pn]||[]).length;
  return `<button class="item" data-open="${p.i}"><span class="ph">${phTag(p)}</span>
   <span class="t">${pre||''}${nf?'<span class="realtag">📷 foto real</span>':''}<span class="pn">${esc(p.pn)}</span><span class="es">${esc(p.es)}</span>${p.en?`<span class="en">${esc(p.en)}</span>`:''}</span>
   <span class="r">${priceHTML(p.pn)}${availHTML(p.pn)}</span></button>`}
function xItemHTML(x){const f=FOTOS['X:'+x.id]||[];
  return `<button class="item" data-openx="${esc(x.id)}"><span class="ph">${f.length?thumbImg(f[0].id):'📦'}</span>

function needOf(items){const need={};items.forEach(it=>{const k=it.xid?'X:'+it.xid:(it.car&&it.pn?it.car+'|'+it.pn:'');if(k)need[k]=(need[k]||0)+it.qty});return need}

function faltan(items,estMap,xMap){const out=[];
  for(const [k,q] of Object.entries(needOf(items))){
    if(k.startsWith('X:')){const x=xMap(k.slice(2));const hay=x&&x.status!=='vendida'?(+x.qty||0):0;if(hay<q)out.push(`${x?x.name:'Pieza agregada'}: hay ${hay}, se quieren cobrar ${q}`);continue}
    const [cid,pn]=k.split('|');const c=CARS.find(x=>x.id===cid);if(!c)continue;const x=stOf(c,pn,estMap(cid));const hay=AVAIL(x.s)?x.n:0;
    if(hay<q)out.push(`${(BYPN[pn]||{}).es||pn} (${c.code}): ${x.s==='vendida'?'ya está vendida':x.s==='apartada'?'está apartada':'hay '+hay}, se quieren cobrar ${q}`)}

function planVenta(items,estMap,xMap){const est={},xs={};

    if(!it.car||!it.pn)return;const c=CARS.find(x=>x.id===it.car);if(!c)return;const m=est[it.car]=est[it.car]||{};

  return {est,xs}}

  const c=await caches.open('piezas-data-v1');let missing=[];for(const u of urls){if(!(await c.match(u)))missing.push(u)}
  OFF={done:urls.length-missing.length,total:urls.length,state:missing.length?'run':'ok'};renderOffline();if(!missing.length)return;

const net=()=>{const n=$('#net');n.textContent=navigator.onLine?'En línea':'Sin señal';n.classList.toggle('off',!navigator.onLine)};
window.addEventListener('online',()=>{net();prefetchAll()});window.addEventListener('offline',net);net();
// ---- versión nueva ----
let NEWV=null;
async function checkVersion(){try{const j=await fetch('version.json',{cache:'no-store'}).then(r=>r.ok?r.json():null);NEWV=j&&j.v&&j.v>VERSION?j.v:null}catch(e){}
  const u=$('#upd');if(u)u.hidden=!NEWV||OWN;if(!sheet.hidden&&SHEET==='menu')openMenu()}
async function activateUpdate(btn){if(btn)btn.textContent='Activando…';
  try{const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('piezas-shell-')).map(k=>caches.delete(k)))}catch(e){}
  try{const r=await navigator.serviceWorker.getRegistration();if(r){await r.update();if(r.waiting)r.waiting.postMessage('skip')}}catch(e){}
  location.reload()}
setTimeout(checkVersion,3000);setInterval(checkVersion,10*60*1000);window.addEventListener('online',checkVersion);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion()});
// ---- entrada: sin sesión se va a la tienda; ?entrar muestra el acceso de vendedores ----
const ENTRAR=/[?&]entrar/.test(location.search),REGISTRO=/[?&]registro/.test(location.search);
// ---- login ----
const L={box:$('#login'),email:$('#l-email'),pass:$('#l-pass'),st:$('#l-status'),neu:$('#l-new')};
let SIGNUP=false,SIGNING=false;
const isMail=()=>L.email.value.includes('@');
function loginMode(){const m=isMail();L.neu.hidden=L.email.value.trim().toLowerCase()!==OWNER;$('#l-reset').hidden=!m;$('#l-signup').hidden=m;
  $('#l-plabel').textContent=m?'Contraseña':SIGNUP?'PIN (6 números)':'PIN';L.pass.inputMode=m?'text':'numeric';
  $('#l-p2box').hidden=!SIGNUP||m;$('#l-go').textContent=SIGNUP&&!m?'Crear mi cuenta':'Entrar';$('#l-signup').textContent=SIGNUP?'Ya tengo cuenta: entrar':'Soy nuevo: crear mi cuenta';
  $('#l-hint').textContent=m?'Entra con tu correo y contraseña.':SIGNUP?'Elige un usuario (el que quieras, que nadie más tenga) y un PIN de 6 números.':'Entra con tu usuario y tu PIN.'}
L.email.addEventListener('input',loginMode);
$('#l-signup').addEventListener('click',()=>{SIGNUP=!SIGNUP;loginMode()});
const lmsg=(m,ok)=>{L.st.className='status '+(ok?'ok':'err');L.st.textContent=m};
const authErr=e=>({'auth/invalid-credential':isMail()?'Correo o contraseña incorrectos.':'Usuario o PIN incorrectos.','auth/wrong-password':'Contraseña incorrecta.','auth/user-not-found':'No existe esa cuenta.','auth/too-many-requests':'Demasiados intentos. Espera unos minutos.','auth/network-request-failed':'Sin señal. La primera vez necesitas internet para entrar.','auth/email-already-in-use':'Ese correo ya tiene cuenta: usa Entrar.','auth/weak-password':'La contraseña debe tener 6 o más caracteres.'}[e.code]||('Error: '+(e.code||e.message)));
$('#l-go').addEventListener('click',async()=>{const u=L.email.value.trim(),p=L.pass.value.trim();
  if(!u){lmsg('Escribe tu usuario.');return}
  if(isMail()){lmsg('Entrando…',true);signInWithEmailAndPassword(auth,u,L.pass.value).catch(e=>lmsg(authErr(e)));return}
  if(!okPin(p)){lmsg('El PIN es de 6 números (o de 4 si es de antes).');return}
  if(SIGNUP&&!okPinNuevo(p)){lmsg('Elige un PIN de 6 números.');return}
  const email=await userEmail(u);
  if(!SIGNUP){lmsg('Entrando…',true);PIN4=p.length===4;try{sessionStorage.setItem('pin4',PIN4?'1':'')}catch(e){}signInWithEmailAndPassword(auth,email,pinPass(p)).catch(e=>lmsg(authErr(e)));return}
  if(p!==$('#l-pass2').value.trim()){lmsg('Los dos PIN no son iguales.');return}
  lmsg('Creando tu cuenta…',true);SIGNING=true;
  try{const cred=await createUserWithEmailAndPassword(auth,email,pinPass(p));
    await setDoc(doc(fs,'users',cred.user.uid),{name:u,user:u,email,role:'empleado',active:false,pending:true,created:new Date().toISOString()});
    await signOut(auth);SIGNING=false;SIGNUP=false;loginMode();L.pass.value='';lmsg('¡Cuenta creada! Pídele al encargado que te active; luego entra con tu usuario y PIN.',true)}
  catch(e){SIGNING=false;if(auth.currentUser)await signOut(auth).catch(()=>{});lmsg(e.code==='auth/email-already-in-use'?'Ese usuario ya existe. Elige otro.':authErr(e))}});
L.neu.addEventListener('click',()=>{lmsg('Creando…',true);createUserWithEmailAndPassword(auth,L.email.value.trim(),L.pass.value).catch(e=>lmsg(authErr(e)))});
$('#l-reset').addEventListener('click',()=>{const em=L.email.value.trim();if(!em){lmsg('Escribe tu correo arriba primero.');return}sendPasswordResetEmail(auth,em).then(()=>lmsg('Te mandamos un correo para cambiar la contraseña.',true),e=>lmsg(authErr(e)))});
let unsubs=[];
onAuthStateChanged(auth,async u=>{if(SIGNING)return;unsubs.forEach(f=>f());unsubs=[];ME=u;LOADED=new Set();CACHE=new Set();PUBLAST=null;
  if(!u){if(!ENTRAR){location.replace('tienda.html');return}$('#app').hidden=true;L.box.hidden=false;if(REGISTRO&&!SIGNUP){SIGNUP=true;loginMode()}return}
  OWN=(u.email||'').toLowerCase()===OWNER;PROFILE=OWN?{name:'Alan'}:null;
  if(!OWN){try{const s=await getDoc(doc(fs,'users',u.uid));PROFILE=s.exists()?s.data():null}catch(e){PROFILE=null}
    if(PROFILE&&PROFILE.active&&PROFILE.role==='dueño')OWN=true;
    if(!PROFILE){try{const c=await getDoc(doc(fs,'clientes',u.uid));if(c.exists()){location.replace('tienda.html#cuenta');return}}catch(e){}}
    if(!PROFILE||!PROFILE.active){lmsg(PROFILE?(PROFILE.pending?'Tu cuenta está esperando que el encargado la active.':'Tu usuario está desactivado. Habla con el encargado.'):'Tu cuenta no está dada de alta. Pide al encargado que te agregue.');await signOut(auth);return}}
  L.box.hidden=true;$('#app').hidden=false;saveCart();
  const rr=()=>{if(sheet.hidden){const y=window.scrollY;render();window.scrollTo(0,y)}};
  const sub=(q,f)=>unsubs.push(onSnapshot(q,f,e=>console.warn(e)));
  const subM=(q,f)=>unsubs.push(onSnapshot(q,{includeMetadataChanges:true},f,e=>console.warn(e)));
  subM(collection(fs,'carros'),s=>{srv('carros',s);pubSync();CARS=s.docs.map(d=>Object.assign({id:d.id},d.data()));rr()});
  subM(collection(fs,'estado'),s=>{srv('estado',s);pubSync();const o={};s.docs.forEach(d=>{o[d.id]=(d.data()||{}).m||{}});EST=o;rr()});
  subM(collection(fs,'precios'),s=>{srv('precios',s);pubSync();const o={};s.docs.forEach(d=>{o[d.id]=(d.data()||{}).price||0});PRICE=o;rr()});
  sub(collection(fs,'alternos'),s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});ALT=o;rr()});
  subM(doc(fs,'indice','fotos'),d=>{if(d.exists())srv('fotos',d);IDXM=(d.exists()&&(d.data()||{}).m)||{};pubSync();
    FOTOLIST=Object.entries(IDXM).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));const o={};FOTOLIST.forEach(f=>{(o[f.pn]=o[f.pn]||[]).push(f)});FOTOS=o;rr();
    if(!(d.metadata&&d.metadata.fromCache))syncIdx(d)});
  subM(collection(fs,'extras'),s=>{srv('extras',s);pubSync();EXTRAS=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.date||'').localeCompare(a.date||''));rr()});
  subM(collection(fs,'config'),s=>{srv('config',s);const d=s.docs.find(x=>x.id==='negocio');NEG=d?d.data():{};const lt=s.docs.find(x=>x.id==='lotes');LOTES=lt?((lt.data()||{}).hechos||{}):{};pubSync()});
  unsubs.push(onSnapshot(doc(fs,'publico','inventario'),{includeMetadataChanges:true},d=>{srv('publico',d);if(d.exists()){const o=Object.assign({},d.data());delete o.t;PUBLAST=JSON.stringify(o)}pubSync()},e=>{LOADED.add('publico');console.warn(e)}));
  if(!OWN){CLIENTES=[];if(CLIID)getDoc(doc(fs,'clientes',CLIID)).then(d=>{if(d.exists())CLIENTES=[Object.assign({id:CLIID},d.data())];rr()}).catch(()=>{})}
  else sub(collection(fs,'clientes'),s=>{CLIENTES=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.created||'').localeCompare(a.created||''));if(st.tab==='carrito'&&sheet.hidden&&!document.activeElement?.id?.startsWith('cli'))rr()});
  if(OWN){sub(query(collection(fs,'ventas'),orderBy('date','desc'),limit(2000)),s=>{const all=s.docs.map(d=>Object.assign({id:d.id},d.data()));SALES=all.filter(x=>!x.cancelada);CANCELADAS=all.filter(x=>x.cancelada);rr()});
    sub(query(collection(fs,'cortes'),orderBy('date','desc'),limit(60)),s=>{CORTES=s.docs.map(d=>Object.assign({id:d.id},d.data()))});
    sub(collection(fs,'resenas'),s=>{RESENAS=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(!sheet.hidden&&SHEET==='menu')openMenu()});
    sub(collection(fs,'privado'),s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});PRIV=o;rr()});
    sub(collection(fs,'users'),s=>{USERS=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.pending?1:0)-(a.pending?1:0));{const n=USERS.filter(x=>x.pending&&!x.active).length;$('#menu-btn').textContent=n?'☰ '+n+' nuevo'+(n>1?'s':''):'☰'}if(!sheet.hidden&&SHEET==='menu')openMenu()})}
  else{sub(query(collection(fs,'ventas'),where('by','==',u.uid)),s=>{const all=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>b.date.localeCompare(a.date));SALES=all.filter(x=>!x.cancelada);CANCELADAS=all.filter(x=>x.cancelada);rr()});
    sub(query(collection(fs,'cortes'),where('by','==',u.uid)),s=>{CORTES=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.date||'').localeCompare(a.date||''))})}
  render();prefetchAll();checkVersion()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
